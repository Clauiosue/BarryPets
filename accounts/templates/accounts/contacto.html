{% extends 'accounts/base_generic.html' %}
{% load static %}
{% block title %}Inicio{% endblock %}

{% block content %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
    <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>
    
<script type="text/javascript">
   (function(){
      emailjs.init("1YY-9qW3G1_Ihz6D9"); 
   })();
</script>

    
</head>
<body class="custom-background-color">
    <br>
    <div class="container-fluid col-md-12">
      <h3>Contacto</h3>
      <p>Email: barrypets.cl@gmail.com</p>
      <p>Telefono: +56999108147</p>
      <form class="row g-3" id="contactForm">
          <div class="col-12 d-flex justify-content-left">
            <div class="col-md-3"> 
              <label for="inputName" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="inputName" name="name">
            </div>
          </div>

          <div class="col-12 d-flex justify-content-left">
            <div class="col-md-3">
              <label for="inputApellido" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="inputApellido" name="apellido">
            </div>
          </div>
          
          <div class="col-12 d-flex justify-content-left">
            <div class="col-md-3">
              <label for="inputEmail" class="form-label">Mail</label>
              <input type="email" class="form-control" id="inputEmail" name="email">
            </div>
          </div>
          
          <div class="col-12 d-flex justify-content-left">
            <div class="col-md-3">
              <label for="inputPhone" class="form-label">Telefono</label>
              <input type="text" class="form-control" id="inputPhone" name="phone">
            </div>
          </div>
          
          <div class="col-12 d-flex justify-content-left">
              <div class="col-md-3">
                <label for="inputConsulta" class="form-label">Consulta</label>
                <textarea class="form-control" id="inputConsulta" name="consulta" rows="4"></textarea> 
                <small id="charCount" class="form-text text-muted">0/150</small>
              </div>
            </div>
          
          <div class="col-12 d-flex justify-content-left">
            <div class="col-md-3">
              <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
          </div>
      </form>
      <div id="message" style="display: none;">Consulta enviada con éxito!</div>
  </div>
    
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

{% endblock %}
